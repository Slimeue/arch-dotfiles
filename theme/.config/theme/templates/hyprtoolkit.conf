# AUTOGENERATED from ~/.config/theme/templates/hyprtoolkit.conf
# Regenerated on every wallpaper change. Do not edit -- edit the template.
#
# Hyprtoolkit is the GUI toolkit behind hyprlauncher (and other hypr* GUI
# apps). hyprlauncher exposes no colour options of its own -- it inherits
# this palette, so theming here themes every Hyprtoolkit app at once.

background     = rgb({{colors.surface.default.hex_stripped}})
base           = rgb({{colors.surface_container.default.hex_stripped}})
alternate_base = rgb({{colors.surface_container_high.default.hex_stripped}})
text           = rgb({{colors.on_surface.default.hex_stripped}})
bright_text    = rgb({{colors.inverse_on_surface.default.hex_stripped}})
link_text      = rgb({{colors.tertiary.default.hex_stripped}})
accent         = rgb({{colors.primary.default.hex_stripped}})
accent_secondary = rgb({{colors.secondary.default.hex_stripped}})
