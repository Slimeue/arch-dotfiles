# AUTOGENERATED from ~/.config/theme/templates/kitty-colors.conf
# Regenerated on every wallpaper change. Do not edit -- edit the template.
#
# Included from kitty.conf. Deliberately does NOT set background_opacity,
# so your manual `background_opacity 0.5` in kitty.conf survives re-themes.

background              {{colors.surface.default.hex}}
foreground              {{colors.on_surface.default.hex}}

cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}

selection_background    {{colors.primary_container.default.hex}}
selection_foreground    {{colors.on_primary_container.default.hex}}

url_color               {{colors.tertiary.default.hex}}

# Window borders between kitty splits
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex}}
bell_border_color       {{colors.error.default.hex}}

# Tab bar
active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
tab_bar_background      {{colors.surface_container_lowest.default.hex}}

# --- ANSI 0-15 --------------------------------------------------------
# 0/8 and 7/15 come from the Material surface ramp so they always sit
# correctly against the background. 1-6 are the harmonised custom_colors from
# config.toml -- recognisable hues carrying the wallpaper's tint.
#
# 9-14 (the bright variants) are derived here with `lighten: 6.0` rather than
# being declared as their own custom colours, because matugen's harmonisation
# collapses a hue and its bright sibling onto nearly the same value. Deriving
# them guarantees colour1 and colour9 stay visibly distinct. 6.0 is small on
# purpose: enough to separate them, not enough to wash them out against a
# light background when the theme is in light mode.

color0  {{colors.surface_container_lowest.default.hex}}
color8  {{colors.surface_container_highest.default.hex}}

color1  {{colors.red.default.hex}}
color9  {{ colors.red.default.hex | to_color | lighten: 6.0 }}

color2  {{colors.green.default.hex}}
color10 {{ colors.green.default.hex | to_color | lighten: 6.0 }}

color3  {{colors.yellow.default.hex}}
color11 {{ colors.yellow.default.hex | to_color | lighten: 6.0 }}

color4  {{colors.blue.default.hex}}
color12 {{ colors.blue.default.hex | to_color | lighten: 6.0 }}

color5  {{colors.magenta.default.hex}}
color13 {{ colors.magenta.default.hex | to_color | lighten: 6.0 }}

color6  {{colors.cyan.default.hex}}
color14 {{ colors.cyan.default.hex | to_color | lighten: 6.0 }}

color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
